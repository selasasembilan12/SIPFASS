<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SIPFAS</title>

    <!-- FONT UTAMA: menggunakan Inter agar konsisten dengan halaman Admin dan Petugas. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS KHUSUS HALAMAN LOGIN. -->
    <link rel="stylesheet" href="Login.css">
</head>
<body>

    <!-- PEMBUNGKUS HALAMAN: menempatkan kartu login tepat di tengah layar. -->
    <main class="login-page">

        <!-- KARTU LOGIN: kotak putih utama yang memuat logo dan formulir masuk. -->
        <section class="login-card">

            <!-- IDENTITAS SIPFAS: logo resmi dan nama institusi. -->
            <div class="brand">
                <img src="../assets/images/logo-sipfas.png" alt="Logo SIPFAS" class="brand-logo">
                <div class="brand-text">
                    <strong>SIPFAS</strong>
                    <span>Informatika UNKHAIR</span>
                </div>
            </div>

            <!-- JUDUL DAN DESKRIPSI HALAMAN LOGIN. -->
            <div class="welcome">
                <h1>Selamat Datang</h1>
                <p>Silakan masuk untuk mengakses sistem</p>
            </div>

            <!-- FORM LOGIN: kolom nama pengguna, kata sandi, dan tombol masuk. -->
            <!-- FORM LOGIN: setelah username dan password diisi, lanjut ke verifikasi -->
            <form class="login-form" id="loginForm" action="verifikasi.html" method="get">

                <!-- INPUT NAMA PENGGUNA: ikon identitas dan kolom username. -->
                <div class="form-group">
                    <label for="username">Nama Pengguna</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3.5" y="5" width="17" height="15" rx="1.5"></rect>
                            <path d="M9 5V3.8A1.8 1.8 0 0 1 10.8 2h2.4A1.8 1.8 0 0 1 15 3.8V5"></path>
                            <circle cx="9" cy="11" r="1.5"></circle>
                            <path d="M6.8 16c.4-1.3 1.2-2 2.2-2s1.8.7 2.2 2M14 11h3.5M14 15h3.5"></path>
                        </svg>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Masukkan nama pengguna"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <!-- INPUT KATA SANDI: ikon gembok, kolom password, dan tombol tampilkan. -->
                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <div class="input-wrapper">
                        <svg class="input-icon lock-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="5" y="10" width="14" height="11" rx="1.8"></rect>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                            <circle cx="12" cy="15" r="1.2"></circle>
                            <path d="M12 16.2v1.5"></path>
                        </svg>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Masukkan kata sandi"
                            autocomplete="current-password"
                            required
                        >

                        <!-- TOMBOL LIHAT KATA SANDI: mengubah input password menjadi teks dan sebaliknya. -->
                        <button class="toggle-password" type="button" id="togglePassword" aria-label="Tampilkan kata sandi">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"></path>
                                <circle cx="12" cy="12" r="2.7"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- TAUTAN LUPA KATA SANDI: diletakkan di sisi kanan bawah kolom password. -->
                <!-- TAUTAN LUPA KATA SANDI: menuju halaman pemulihan akun. -->
                <div class="forgot-password">
                    <a href="pemulihan.html">Lupa Kata Sandi?</a>
                </div>

                <!-- TOMBOL MASUK: tombol utama untuk mengirim formulir login. -->
                <button type="submit" class="login-button">
                    <span>Masuk</span>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 12h14M13 6l6 6-6 6"></path>
                    </svg>
                </button>
            </form>

            <!-- PEMBATAS: garis tipis pemisah formulir dengan tautan pendaftaran. -->
            <div class="card-divider"></div>

            <!-- TAUTAN DAFTAR: akses bagi pengguna yang belum memiliki akun. -->
            <p class="register-text">
    Belum punya akun?
    <a href="registrasi.html">Daftar Sekarang</a>
</p>

        </section>
    </main>

    <!-- INTERAKSI IKON MATA: menampilkan atau menyembunyikan kata sandi. -->
    <script>
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');

        togglePassword.addEventListener('click', function () {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassword.setAttribute(
                'aria-label',
                isPassword ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'
            );
        });
    </script>

</body>
</html>
