<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemulihan Kata Sandi | SIPFAS</title>

    <!-- FONT UTAMA: Inter agar konsisten dengan Login dan halaman SIPFAS lainnya. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS KHUSUS HALAMAN PEMULIHAN KATA SANDI. -->
    <link rel="stylesheet" href="pemulihan.css">
</head>
<body>

    <!-- PEMBUNGKUS HALAMAN: memusatkan kartu pemulihan di tengah layar. -->
    <main class="recovery-page">

        <!-- KARTU PEMULIHAN: kotak putih utama sesuai desain referensi. -->
        <section class="recovery-card">

            <!-- IDENTITAS SIPFAS: menggunakan logo resmi dari folder assets. -->
            <div class="brand">
                <img src="../assets/images/logo-sipfas.png"
                     alt="Logo SIPFAS" class="brand-logo">
                <div class="brand-text">
                    <strong>SIPFAS</strong>
                    <span>Informatika UNKHAIR</span>
                </div>
            </div>

            <!-- JUDUL DAN DESKRIPSI PEMULIHAN KATA SANDI. -->
            <header class="recovery-header">
                <h1>Lupa Kata Sandi?</h1>
                <p>
                    Masukkan email yang terdaftar untuk menerima kode
                    verifikasi pemulihan akun Anda.
                </p>
            </header>

            <!-- FORM PEMULIHAN: pengguna memasukkan email terdaftar. -->
            <form action="verifikasi-otp-pemulihan.html" method="get">

                <div class="form-group">
                    <label for="email">EMAIL TERDAFTAR</label>

                    <!-- INPUT EMAIL: ikon amplop dan kolom email. -->
                    <div class="input-box">
                        <svg class="email-icon" viewBox="0 0 24 24"
                             fill="none" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="14" rx="2"
                                  stroke="currentColor" stroke-width="1.8"/>
                            <path d="M4 7L12 13L20 7"
                                  stroke="currentColor" stroke-width="1.8"
                                  stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>

                        <input
                            type="email"
                            id="email"
                            placeholder="contoh: rahmat@unkhair.ac.id"
                            autocomplete="email"
                            required
>
                    </div>

                    <!-- PESAN ERROR: ditampilkan jika email kosong atau tidak valid. -->
                    <small class="error-message" id="emailError" role="alert"></small>
                </div>

                <!-- INFORMASI KEAMANAN: menjelaskan perlindungan privasi akun. -->
                <div class="security-info">
                    <svg class="shield-icon" viewBox="0 0 24 24"
                         fill="none" aria-hidden="true">
                        <path d="M12 2L20 5V11C20 16 16.5 20 12 22
                                 C7.5 20 4 16 4 11V5L12 2Z"
                              fill="currentColor"/>
                    </svg>

                    <p class="security-description">
                        Demi privasi dan keamanan sistem, konfirmasi
                        pengiriman akan selalu diberikan terlepas dari status
                        ketersediaan akun di database.
                    </p>
                </div>

                <!-- TOMBOL KIRIM: mengirim permintaan kode verifikasi. -->
                <button type="submit" class="submit-button">
                    <span>Kirim Kode Verifikasi</span>
                    <svg class="arrow-icon" viewBox="0 0 24 24"
                         fill="none" aria-hidden="true">
                        <path d="M4 12H20M14 6L20 12L14 18"
                              stroke="currentColor" stroke-width="1.8"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <!-- PESAN STATUS: konfirmasi umum setelah format email valid. -->
                <p class="form-message" id="formMessage"
                   role="status" aria-live="polite"></p>
            </form>

            <!-- TAUTAN KEMBALI: mengarahkan pengguna ke halaman Login. -->
            <a href="login.html" class="back-link">
                <svg class="back-icon" viewBox="0 0 24 24"
                     fill="none" aria-hidden="true">
                    <path d="M20 12H4M10 6L4 12L10 18"
                          stroke="currentColor" stroke-width="1.8"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Kembali ke Halaman Login</span>
            </a>

        </section>
    </main>
</body>
</html>
