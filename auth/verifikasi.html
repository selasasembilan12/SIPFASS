<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifikasi Dua Langkah | SIPFAS</title>

    <!-- FONT UTAMA: menggunakan Inter agar konsisten dengan halaman SIPFAS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS KHUSUS HALAMAN VERIFIKASI OTP. -->
    <link rel="stylesheet" href="Verifikasi.css" />
  </head>
  <body>
    <!-- PEMBUNGKUS HALAMAN: memusatkan kartu verifikasi. -->
    <main class="verification-page">
      <!-- KARTU VERIFIKASI: menampung identitas SIPFAS dan form OTP. -->
      <section class="verification-card">
        <!-- IDENTITAS SIPFAS: menampilkan logo dan nama institusi. -->
        <div class="brand">
          <img
            src="../assets/images/logo-sipfas.png"
            alt="Logo SIPFAS"
            class="brand-logo"
          />
          <div class="brand-text">
            <strong>SIPFAS</strong>
            <span>Informatika UNKHAIR</span>
          </div>
        </div>

        <!-- JUDUL DAN PETUNJUK: menjelaskan proses verifikasi dua langkah. -->
        <div class="verification-heading">
          <h1>Verifikasi Dua Langkah</h1>
          <p>
            Masukkan 8 digit kode verifikasi yang dikirim ke email<br
              class="desktop-break"
            />
            terdaftar Anda
          </p>

          <!-- EMAIL TUJUAN: menampilkan alamat email yang disamarkan oleh server. -->
          <div class="email-badge">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="1.5"></rect>
              <path d="m4 7 8 6 8-6"></path>
            </svg>
            <span>ra***@email.com</span>
          </div>
        </div>

        <!-- FORM OTP: menyediakan delapan kotak untuk memasukkan kode verifikasi. -->
        <form class="verification-form" id="verificationForm">
          <div class="otp-inputs" aria-label="Masukkan kode OTP 8 digit">
            <input
              class="otp-input"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="1"
              aria-label="Digit 1"
              required
            />
            <input
              class="otp-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 2"
              required
            />
            <input
              class="otp-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 3"
              required
            />
            <input
              class="otp-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 4"
              required
            />
            <input
              class="otp-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 5"
              required
            />
            <input
              class="otp-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 6"
              required
            />
            <input
              class="otp-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 7"
              required
            />
            <input
              class="otp-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 8"
              required
            />
          </div>

          <!-- TOMBOL VERIFIKASI: mengirim delapan digit OTP ke server. -->
          <button type="submit" class="verification-button">Verifikasi</button>
        </form>

        <!-- PETUNJUK TAMBAHAN: mengingatkan tujuan pengiriman kode OTP. -->
        <p class="verification-description">
          Masukkan 8 digit kode verifikasi yang dikirim ke email terdaftar Anda
        </p>

        <!-- NAVIGASI KEMBALI: mengarahkan pengguna ke halaman Login. -->
        <a href="Login.html" class="back-to-login">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 12H5M11 18l-6-6 6-6"></path>
          </svg>
          <span>Kembali ke Login</span>
        </a>
      </section>

      <!-- PEMBERITAHUAN: menjelaskan batas waktu penggunaan OTP. -->
      <p class="otp-notice">
        Pemberitahuan: Kode OTP hanya berlaku selama 2 menit.
      </p>
    </main>

    <!-- JAVASCRIPT: mengaktifkan proses pengiriman dan verifikasi OTP. -->
    <script src="verifikasi.js"></script>
  </body>
</html>
