<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Kata Sandi Baru | SIPFAS</title>

    <!-- FONT UTAMA: Inter agar konsisten dengan halaman autentikasi SIPFAS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS KHUSUS HALAMAN BUAT KATA SANDI BARU. -->
    <link rel="stylesheet" href="password-baru.css">
</head>
<body>

    <!-- PEMBUNGKUS HALAMAN: memusatkan kartu kata sandi baru. -->
    <main class="password-page">

        <!-- KARTU PASSWORD: kotak putih utama sesuai desain referensi. -->
        <section class="password-card">

            <!-- IDENTITAS SIPFAS: menggunakan logo asli dari folder assets. -->
            <div class="brand">
                <img src="../assets/images/logo-sipfas.png"
                     alt="Logo SIPFAS" class="brand-logo">
                <div class="brand-text">
                    <strong>SIPFAS</strong>
                    <span>Informatika UNKHAIR</span>
                </div>
            </div>

            <!-- JUDUL DAN DESKRIPSI HALAMAN. -->
            <header class="password-header">
                <h1>Buat Kata Sandi Baru</h1>
                <p>Silakan buat kata sandi baru untuk akun Anda</p>
            </header>

            <!-- FORM PASSWORD: tempat memasukkan dan mengonfirmasi kata sandi baru. -->
            <form id="passwordForm" action="login.html" method="get">

                <!-- INPUT KATA SANDI BARU. -->
                <div class="form-group">
                    <label for="newPassword">KATA SANDI BARU</label>
                    <div class="input-box">
                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Masukkan kata sandi baru"
                            autocomplete="new-password"
                            required
                        >
                        <span class="eye-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </span>
                    </div>
                </div>

                <!-- INPUT KONFIRMASI KATA SANDI. -->
                <div class="form-group">
                    <label for="confirmPassword">KONFIRMASI KATA SANDI</label>
                    <div class="input-box">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Ulangi kata sandi baru"
                            autocomplete="new-password"
                            required
                        >
                        <span class="eye-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </span>
                    </div>
                </div>

                <!-- INFORMASI SYARAT KEAMANAN KATA SANDI. -->
                <div class="security-box">
                    <p class="security-title">Syarat Keamanan Kata Sandi:</p>
                    <ul class="security-list">
                        <li><span class="requirement-circle"></span>Minimal 8 karakter</li>
                        <li><span class="requirement-circle"></span>Mengandung huruf besar, huruf kecil, dan angka</li>
                        <li><span class="requirement-circle"></span>Kedua kata sandi cocok</li>
                    </ul>
                </div>

                <!-- TOMBOL SIMPAN: pada prototipe mengarahkan kembali ke halaman Login. -->
                <button type="submit" class="save-button">
                    <span>Simpan Kata Sandi</span>
                    <svg class="save-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M20 11.5A8.5 8.5 0 1 1 17.5 5" />
                        <path d="M20 4v5h-5" />
                        <path d="M12 7v5l3 2" />
                    </svg>
                </button>
            </form>

            <!-- TAUTAN KEMBALI KE LOGIN. -->
            <a href="login.html" class="back-link">
                <svg class="back-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M20 12H4M10 6L4 12L10 18"/>
                </svg>
                <span>Kembali ke Login</span>
            </a>

        </section>
    </main>
</body>
</html>
