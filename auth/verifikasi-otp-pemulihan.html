<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi OTP Pemulihan | SIPFAS</title>

    <!-- FONT UTAMA: Inter agar konsisten dengan halaman autentikasi SIPFAS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS KHUSUS HALAMAN VERIFIKASI OTP PEMULIHAN. -->
    <link rel="stylesheet" href="verifikasi-otp-pemulihan.css">
</head>
<body>

    <!-- PEMBUNGKUS HALAMAN: memusatkan kartu OTP di tengah layar. -->
    <main class="otp-page">

        <!-- KARTU OTP: memuat identitas SIPFAS, email, dan formulir verifikasi. -->
        <section class="otp-card">

            <!-- IDENTITAS SIPFAS: menggunakan logo resmi dari folder assets. -->
            <div class="brand">
                <img src="../assets/images/logo-sipfas.png"
                     alt="Logo SIPFAS" class="brand-logo">
                <div class="brand-text">
                    <strong>SIPFAS</strong>
                    <span>Informatika UNKHAIR</span>
                </div>
            </div>

            <!-- JUDUL DAN PETUNJUK VERIFIKASI OTP PEMULIHAN. -->
            <header class="otp-header">
                <h1>Verifikasi OTP Pemulihan</h1>
                <p>Masukkan 8 digit kode verifikasi yang dikirim ke email institusi Anda.</p>

                <!-- EMAIL TUJUAN: ditampilkan dalam bentuk tersamarkan. -->
                <div class="email-badge">
                    <svg class="email-icon" viewBox="0 0 24 24"
                         fill="none" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="1.5"
                              stroke="currentColor" stroke-width="1.8"/>
                        <path d="M4 7L12 13L20 7"
                              stroke="currentColor" stroke-width="1.8"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span id="maskedEmail">ra***@unkhair.ac.id</span>
                </div>
            </header>

            <!-- FORM OTP: delapan kotak input sesuai pola verifikasi SIPFAS. -->
            <!-- FORM OTP: mengarahkan pengguna ke halaman buat kata sandi baru. -->
            <form id="otpForm" action="password-baru.html" method="get">
                <div class="otp-inputs" aria-label="Masukkan kode OTP 8 digit">
                    <input class="otp-input" type="text" inputmode="numeric" maxlength="1"
                           autocomplete="one-time-code" aria-label="Digit OTP 1">
                    <input class="otp-input" type="text" inputmode="numeric" maxlength="1"
                           aria-label="Digit OTP 2">
                    <input class="otp-input" type="text" inputmode="numeric" maxlength="1"
                           aria-label="Digit OTP 3">
                    <input class="otp-input" type="text" inputmode="numeric" maxlength="1"
                           aria-label="Digit OTP 4">
                    <input class="otp-input" type="text" inputmode="numeric" maxlength="1"
                           aria-label="Digit OTP 5">
                    <input class="otp-input" type="text" inputmode="numeric" maxlength="1"
                           aria-label="Digit OTP 6">
                    <input class="otp-input" type="text" inputmode="numeric" maxlength="1"
                           aria-label="Digit OTP 7">
                    <input class="otp-input" type="text" inputmode="numeric" maxlength="1"
                           aria-label="Digit OTP 8">
                </div>

                <!-- PESAN VALIDASI: menampilkan kesalahan atau informasi proses. -->
                <p class="otp-message" id="otpMessage" role="status" aria-live="polite"></p>

                <!-- TIMER: menunjukkan sisa masa berlaku kode OTP. -->
                <div class="timer-row">
                    <div class="timer-label">
                        <svg class="clock-icon" viewBox="0 0 24 24"
                             fill="none" aria-hidden="true">
                            <circle cx="12" cy="13" r="8.5"
                                    stroke="currentColor" stroke-width="1.8"/>
                            <path d="M10 2.5H14M12 2.5V4.5M18.2 6.8L19.5 5.5"
                                  stroke="currentColor" stroke-width="1.8"
                                  stroke-linecap="round"/>
                            <path d="M12 8V13L15 15"
                                  stroke="currentColor" stroke-width="1.8"
                                  stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>Masa berlaku kode:</span>
                    </div>
                    <span class="timer-value" id="timer">02:59</span>
                </div>

                <!-- TOMBOL VERIFIKASI: memvalidasi kelengkapan kode OTP. -->
                <button type="submit" class="verify-button">
                    <span>Verifikasi</span>
                    <svg class="arrow-icon" viewBox="0 0 24 24"
                         fill="none" aria-hidden="true">
                        <path d="M4 12H20M14 6L20 12L14 18"
                              stroke="currentColor" stroke-width="1.8"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>

            <!-- KIRIM ULANG: tersedia kembali setelah timer berakhir. -->
            <div class="resend-row">
                <span>Tidak menerima kode?</span>
                <button type="button" id="resendButton"
                        class="resend-button" disabled>
                    Kirim Ulang Kode
                </button>
            </div>

            <!-- NAVIGASI KEMBALI: kembali ke halaman pemulihan akun. -->
            <a href="pemulihan.html" class="back-link">
                <svg class="back-icon" viewBox="0 0 24 24"
                     fill="none" aria-hidden="true">
                    <path d="M20 12H4M10 6L4 12L10 18"
                          stroke="currentColor" stroke-width="1.8"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Kembali ke Pemulihan Akun</span>
            </a>

        </section>
    </main>
</body>
</html>
