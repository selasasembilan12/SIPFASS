<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verifikasi Dua Langkah - SIPFAS</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./verifikasi.css">
</head>

<body>

    <main class="verification-page">

        <div class="verification-wrapper">

            <!-- KARTU VERIFIKASI -->
            <section class="verification-card">

                <!-- LOGO DAN IDENTITAS SIPFAS -->
                <div class="brand">

                    <img
                        src="../../../assets/images/logo-sipfas.png"
                        alt="Logo SIPFAS"
                        class="brand-logo"
                    >

                    <div class="brand-text">
                        <strong>SIPFAS</strong>
                        <span>Informatika UNKHAIR</span>
                    </div>

                </div>

                <!-- JUDUL DAN DESKRIPSI -->
                <header class="verification-header">

                    <h1>Verifikasi Dua Langkah</h1>

                    <p class="verification-description">
                        Masukkan 8 digit kode verifikasi yang dikirim ke email<br>
                        terdaftar Anda
                    </p>

                    <!-- EMAIL PENGGUNA -->
                    <div class="email-badge">

                        <svg
                            class="email-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                                stroke="currentColor"
                                stroke-width="2"
                            />

                            <path
                                d="M4 7L12 13L20 7"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>

                        <span id="maskedEmail">mi***@email.com</span>

                    </div>

                </header>

                <!-- FORM VERIFIKASI OTP -->
                <form id="verificationForm" novalidate>

                    <!-- DELAPAN KOTAK OTP -->
                    <div class="otp-container" id="otpContainer">

                        <input
                            class="otp-input"
                            type="text"
                            inputmode="numeric"
                            maxlength="1"
                            autocomplete="one-time-code"
                            aria-label="Digit kode 1"
                        >

                        <input
                            class="otp-input"
                            type="text"
                            inputmode="numeric"
                            maxlength="1"
                            aria-label="Digit kode 2"
                        >

                        <input
                            class="otp-input"
                            type="text"
                            inputmode="numeric"
                            maxlength="1"
                            aria-label="Digit kode 3"
                        >

                        <input
                            class="otp-input"
                            type="text"
                            inputmode="numeric"
                            maxlength="1"
                            aria-label="Digit kode 4"
                        >

                        <input
                            class="otp-input"
                            type="text"
                            inputmode="numeric"
                            maxlength="1"
                            aria-label="Digit kode 5"
                        >

                        <input
                            class="otp-input"
                            type="text"
                            inputmode="numeric"
                            maxlength="1"
                            aria-label="Digit kode 6"
                        >

                        <input
                            class="otp-input"
                            type="text"
                            inputmode="numeric"
                            maxlength="1"
                            aria-label="Digit kode 7"
                        >

                        <input
                            class="otp-input"
                            type="text"
                            inputmode="numeric"
                            maxlength="1"
                            aria-label="Digit kode 8"
                        >

                    </div>

                    <!-- PESAN VALIDASI -->
                    <p
                        class="error-message"
                        id="otpError"
                        role="alert"
                    ></p>

                    <!-- TOMBOL VERIFIKASI -->
                    <button
                        type="submit"
                        class="verification-button"
                    >
                        Verifikasi
                    </button>

                </form>

                <!-- INFORMASI VERIFIKASI -->
                <p class="verification-info">
                    Masukkan 8 digit kode verifikasi yang dikirim ke email terdaftar<br>
                    Anda
                </p>

                <!-- KEMBALI KE LOGIN -->
                <a
                    href="../Login/login.html"
                    class="back-link"
                >
                    <span class="back-arrow">←</span>
                    <span>Kembali ke Login</span>
                </a>

            </section>

            <!-- PEMBERITAHUAN -->
            <p class="verification-footer">
                Pemberitahuan: Kode OTP hanya berlaku selama 5 menit.
            </p>

        </div>

    </main>

    <!-- JAVASCRIPT -->
    <script src="./verifikasi.js"></script>

</body>
</html>
