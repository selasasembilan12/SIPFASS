
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Kata Sandi Baru - SIPFAS</title>

    <link rel="stylesheet" href="./password-baru.css">
</head>

<body>

    <main class="password-page">

        <section class="password-card">

            <!-- LOGO SIPFAS -->
            <div class="brand">

                <img
                    src="../../../assets/images/logo-sipfas.png"
                    alt="Logo SIPFAS"
                    class="brand-logo"
                >

                <div class="brand-name">
                    <strong>SIPFAS</strong>
                    <span>Informatika UNKHAIR</span>
                </div>

            </div>


            <!-- JUDUL HALAMAN -->
            <header class="password-header">

                <h1>Buat Kata Sandi Baru</h1>

                <p>
                    Silakan buat kata sandi baru untuk akun Anda
                </p>

            </header>


            <!-- FORM KATA SANDI -->
            <form id="passwordForm" novalidate>

                <!-- KATA SANDI BARU -->
                <div class="form-group">

                    <label for="newPassword">
                        KATA SANDI BARU
                    </label>

                    <div class="input-box">

                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Masukkan kata sandi baru"
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="eye-button"
                            id="toggleNewPassword"
                            aria-label="Tampilkan kata sandi"
                            title="Tampilkan kata sandi"
                        >

                            <svg
                                class="eye-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                            >

                                <path
                                    d="M2 12C4.2 7.8 7.7 5.5 12 5.5C16.3 5.5 19.8 7.8 22 12C19.8 16.2 16.3 18.5 12 18.5C7.7 18.5 4.2 16.2 2 12Z"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />

                            </svg>

                        </button>

                    </div>

                    <small class="field-error" id="newPasswordError"></small>

                </div>


                <!-- KONFIRMASI KATA SANDI -->
                <div class="form-group">

                    <label for="confirmPassword">
                        KONFIRMASI KATA SANDI
                    </label>

                    <div class="input-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Ulangi kata sandi baru"
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="eye-button"
                            id="toggleConfirmPassword"
                            aria-label="Tampilkan kata sandi"
                            title="Tampilkan kata sandi"
                        >

                            <svg
                                class="eye-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                            >

                                <path
                                    d="M2 12C4.2 7.8 7.7 5.5 12 5.5C16.3 5.5 19.8 7.8 22 12C19.8 16.2 16.3 18.5 12 18.5C7.7 18.5 4.2 16.2 2 12Z"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />

                            </svg>

                        </button>

                    </div>

                    <small class="field-error" id="confirmPasswordError"></small>

                </div>


                <!-- SYARAT KEAMANAN KATA SANDI -->
                <div class="security-box">

                    <p class="security-title">
                        Syarat Keamanan Kata Sandi:
                    </p>

                    <ul class="security-list">

                        <li id="requirementLength">
                            <span class="requirement-circle"></span>
                            <span>Minimal 8 karakter</span>
                        </li>

                        <li id="requirementCharacter">
                            <span class="requirement-circle"></span>
                            <span>Mengandung huruf besar, huruf kecil, dan angka</span>
                        </li>

                        <li id="requirementMatch">
                            <span class="requirement-circle"></span>
                            <span>Kedua kata sandi cocok</span>
                        </li>

                    </ul>

                </div>


                <!-- PESAN FORM -->
                <p
                    class="form-message"
                    id="formMessage"
                    role="status"
                    aria-live="polite"
                ></p>


                <!-- TOMBOL SIMPAN KATA SANDI -->
                <button
                    type="submit"
                    class="save-button"
                >

                    <span>Simpan Kata Sandi</span>

                    <!-- IKON LINGKARAN DENGAN GEMBOK DI DALAMNYA -->
                    <svg
                        class="save-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <!-- Lingkaran luar -->
                        <circle
                            cx="12"
                            cy="12"
                            r="10"
                            stroke="currentColor"
                            stroke-width="1.8"
                        />

                        <!-- Bagian lengkung atas gembok -->
                        <path
                            d="M9 11V9C9 7.34 10.34 6 12 6C13.66 6 15 7.34 15 9V11"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                        />

                        <!-- Badan gembok -->
                        <rect
                            x="7.5"
                            y="11"
                            width="9"
                            height="7"
                            rx="1.3"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linejoin="round"
                        />

                        <!-- Lubang kunci -->
                        <circle
                            cx="12"
                            cy="14"
                            r="0.8"
                            fill="currentColor"
                        />

                        <path
                            d="M12 14.8V16"
                            stroke="currentColor"
                            stroke-width="1.4"
                            stroke-linecap="round"
                        />

                    </svg>

                </button>

            </form>


            <!-- KEMBALI KE LOGIN -->
            <a
                href="../Login/login.html"
                class="back-link"
            >

                <svg
                    class="back-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path
                        d="M20 12H4"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />

                    <path
                        d="M10 6L4 12L10 18"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

                <span>Kembali ke Login</span>

            </a>

        </section>

    </main>

    <script src="./password-baru.js"></script>

</body>
</html>
