<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lupa Kata Sandi - SIPFAS</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./lupa-password.css">

</head>

<body>

    <main class="forgot-page">

        <!-- KARTU LUPA PASSWORD -->
        <section class="forgot-card">

            <!-- LOGO DAN IDENTITAS SIPFAS -->
            <div class="brand">

                <img
                    src="../../../assets/images/logo-sipfas.png"
                    alt="Logo SIPFAS"
                    class="brand-logo"
                >

                <div class="brand-text">

                    <strong>SIPFAS</strong>

                    <span>Informatika UNKHAIR</span>

                </div>

            </div>


            <!-- JUDUL -->
            <header class="forgot-header">

                <h1>Lupa Kata Sandi?</h1>

                <p class="forgot-description">
                    Masukkan email yang terdaftar untuk menerima kode<br>
                    verifikasi pemulihan akun Anda.
                </p>

            </header>


            <!-- FORM LUPA PASSWORD -->
            <form id="forgotForm" novalidate>

                <!-- LABEL EMAIL -->
                <div class="form-group">

                    <label for="email">
                        EMAIL TERDAFTAR
                    </label>

                    <!-- INPUT EMAIL -->
                    <div class="input-box">

                        <!-- IKON EMAIL -->
                        <svg
                            class="email-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                                stroke="currentColor"
                                stroke-width="1.8"
                            />

                            <path
                                d="M4 7L12 13L20 7"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                        </svg>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="contoh: rahmat@unkhair.ac.id"
                            autocomplete="email"
                        >

                    </div>

                    <!-- PESAN ERROR -->
                    <small
                        class="error-message"
                        id="emailError"
                        role="alert"
                    ></small>

                </div>


                <!-- INFORMASI KEAMANAN -->
                <div class="security-info">

                    <!-- IKON PERISAI -->
                    <svg
                        class="shield-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <path
                            d="M12 2L20 5V11C20 16 16.5 20 12 22C7.5 20 4 16 4 11V5L12 2Z"
                            fill="currentColor"
                        />

                    </svg>

                    <!-- DESKRIPSI SESUAI DESAIN ASLI -->
                    <p class="security-description">
                        Demi privasi dan keamanan sistem, konfirmasi<br>
                        pengiriman akan selalu diberikan terlepas dari status<br>
                        ketersediaan akun di database.
                    </p>

                </div>


                <!-- TOMBOL KIRIM -->
                <button
                    type="submit"
                    class="submit-button"
                >

                    <span>
                        Kirim Kode Verifikasi
                    </span>

                    <!-- IKON PANAH -->
                    <svg
                        class="arrow-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <path
                            d="M4 12H20"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />

                        <path
                            d="M14 6L20 12L14 18"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                </button>


                <!-- PESAN FORM -->
                <p
                    class="form-message"
                    id="formMessage"
                    role="status"
                    aria-live="polite"
                ></p>

            </form>


            <!-- KEMBALI KE LOGIN -->
            <a
                href="../Login/login.html"
                class="back-link"
            >

                <!-- IKON PANAH KIRI -->
                <svg
                    class="back-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >

                    <path
                        d="M20 12H4"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />

                    <path
                        d="M10 6L4 12L10 18"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

                <span>
                    Kembali ke Halaman Login
                </span>

            </a>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="./lupa-password.js"></script>

</body>
</html>
