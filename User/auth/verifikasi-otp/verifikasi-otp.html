<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verifikasi OTP Pemulihan - SIPFAS</title>

    <link rel="stylesheet" href="./verifikasi-otp.css">
</head>

<body>

    <main class="otp-page">

        <section class="otp-card">

            <!-- LOGO SIPFAS -->
            <div class="brand">

                <img
                    src="../../../assets/images/logo-sipfas.png"
                    alt="Logo SIPFAS"
                    class="brand-logo"
                >

                <div class="brand-text">
                    <strong>SIPFAS</strong>
                    <span>Informatika UNKHAIR</span>
                </div>

            </div>


            <!-- JUDUL DAN DESKRIPSI -->
            <header class="otp-header">

                <h1>Verifikasi OTP Pemulihan</h1>

                <p>
                    Masukkan 6 digit kode verifikasi yang dikirim ke<br>
                    email institusi Anda.
                </p>

                <!-- EMAIL PENGGUNA -->
                <div class="email-badge">

                    <svg
                        class="email-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <rect
                            x="3"
                            y="5"
                            width="18"
                            height="14"
                            rx="2"
                            stroke="currentColor"
                            stroke-width="2"
                        />

                        <path
                            d="M4 7L12 13L20 7"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>

                    <span id="maskedEmail">
                        ra***@unkhair.ac.id
                    </span>

                </div>

            </header>


            <!-- FORM OTP -->
            <form id="otpForm" novalidate>

                <div class="otp-container">

                    <input class="otp-input" type="text"
                        inputmode="numeric" maxlength="1"
                        autocomplete="one-time-code"
                        aria-label="Digit OTP 1">

                    <input class="otp-input" type="text"
                        inputmode="numeric" maxlength="1"
                        aria-label="Digit OTP 2">

                    <input class="otp-input" type="text"
                        inputmode="numeric" maxlength="1"
                        aria-label="Digit OTP 3">

                    <input class="otp-input" type="text"
                        inputmode="numeric" maxlength="1"
                        aria-label="Digit OTP 4">

                    <input class="otp-input" type="text"
                        inputmode="numeric" maxlength="1"
                        aria-label="Digit OTP 5">

                    <input class="otp-input" type="text"
                        inputmode="numeric" maxlength="1"
                        aria-label="Digit OTP 6">

                    <input class="otp-input" type="text"
                        inputmode="numeric" maxlength="1"
                        aria-label="Digit OTP 7">

                    <input class="otp-input" type="text"
                        inputmode="numeric" maxlength="1"
                        aria-label="Digit OTP 8">

                </div>


                <!-- PESAN ERROR -->
                <p
                    class="error-message"
                    id="otpError"
                    role="alert"
                ></p>


                <!-- INFORMASI MASA BERLAKU -->
                <div class="timer-row">

                    <div class="timer-label">

                        <!-- IKON STOPWATCH -->
                        <svg
                            class="clock-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >

                            <!-- Lingkaran stopwatch -->
                            <circle
                                cx="12"
                                cy="13"
                                r="8.5"
                                stroke="currentColor"
                                stroke-width="1.8"
                            />

                            <!-- Tombol bagian atas -->
                            <path
                                d="M10 2.5H14"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />

                            <path
                                d="M12 2.5V4.5"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />

                            <!-- Tombol samping -->
                            <path
                                d="M18.2 6.8L19.5 5.5"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />

                            <!-- Jarum stopwatch -->
                            <path
                                d="M12 8V13L15 15"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                        </svg>

                        <span>Masa berlaku kode:</span>

                    </div>

                    <span class="timer-value" id="timer">
                        02:59
                    </span>

                </div>


                <!-- TOMBOL VERIFIKASI -->
                <button
                    type="submit"
                    class="verify-button"
                >

                    <span>Verifikasi</span>

                    <svg
                        class="arrow-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            d="M4 12H20"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />

                        <path
                            d="M14 6L20 12L14 18"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>

                </button>

            </form>


            <!-- KIRIM ULANG KODE -->
            <div class="resend-row">

                <span>Tidak menerima kode?</span>

                <button
                    type="button"
                    id="resendButton"
                    class="resend-button"
                >
                    Kirim Ulang Kode
                </button>

            </div>


            <!-- KEMBALI KE PEMULIHAN AKUN -->
            <a
                href="../lupa-password/lupa-password.html"
                class="back-link"
            >

                <svg
                    class="back-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        d="M20 12H4"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />

                    <path
                        d="M10 6L4 12L10 18"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>

                <span>Kembali ke Pemulihan Akun</span>

            </a>

        </section>

    </main>

    <script src="./verifikasi-otp.js"></script>

</body>
</html>
