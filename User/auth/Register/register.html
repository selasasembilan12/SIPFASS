
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - SIPFAS</title>
    <link rel="stylesheet" href="./register.css">
</head>
<body>

<header class="page-header">
    <p>SIPFAS</p>
</header>

<main class="register-stage">
<section class="register-card">

    <div class="brand">
        <img src="../../../assets/images/logo-sipfas.png"
             alt="Logo SIPFAS" class="brand-logo">

        <div class="brand-name">
            <strong>SIPFAS</strong>
            <span>Informatika UNKHAIR</span>
        </div>
    </div>

    <header class="register-heading">
        <h1>DAFTAR AKUN</h1>
    </header>

    <form id="registerForm" novalidate>

        <!-- NAMA LENGKAP -->
        <div class="form-group">
            <label for="fullName">Nama Lengkap <span>*</span></label>

            <div class="input-box">
                <input type="text" id="fullName"
                       placeholder="cth. Ahmad Fauzi"
                       autocomplete="name">

                <!-- IKON KARTU IDENTITAS -->
                <svg class="field-icon identity-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     xmlns="http://www.w3.org/2000/svg">

                    <!-- Klip atas -->
                    <path d="M9 4H15V6H9V4Z"
                          stroke="currentColor"
                          stroke-width="1.7"
                          stroke-linejoin="round"/>

                    <!-- Badan kartu -->
                    <rect x="4" y="6" width="16" height="14"
                          rx="1.5"
                          stroke="currentColor"
                          stroke-width="1.7"/>

                    <!-- Kepala orang -->
                    <circle cx="9" cy="11" r="1.6"
                            stroke="currentColor"
                            stroke-width="1.5"/>

                    <!-- Bahu orang -->
                    <path d="M6.5 16C6.9 14.4 7.8 13.7 9 13.7
                             C10.2 13.7 11.1 14.4 11.5 16"
                          stroke="currentColor"
                          stroke-width="1.5"
                          stroke-linecap="round"/>

                    <!-- Dua garis informasi -->
                    <path d="M13.5 11H17"
                          stroke="currentColor"
                          stroke-width="1.5"
                          stroke-linecap="round"/>

                    <path d="M13.5 14H17"
                          stroke="currentColor"
                          stroke-width="1.5"
                          stroke-linecap="round"/>
                </svg>
            </div>

            <small class="field-error" id="fullNameError"></small>
        </div>


        <!-- NIM DAN USERNAME -->
        <div class="form-row">

            <div class="form-group">
                <label for="nim">NIM <span>*</span></label>

                <div class="input-box">
                    <input type="text" id="nim"
                           placeholder="cth. 07352011045"
                           inputmode="numeric">

                    <!-- IKON 123 -->
                    <svg class="field-icon number-icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         xmlns="http://www.w3.org/2000/svg">

                        <rect x="3" y="5.5" width="18" height="13"
                              rx="1.7"
                              stroke="currentColor"
                              stroke-width="1.7"/>

                        <text x="12" y="14.2"
                              text-anchor="middle"
                              fill="currentColor"
                              font-family="Arial, Helvetica, sans-serif"
                              font-size="7.5"
                              font-weight="600">123</text>
                    </svg>
                </div>

                <small class="field-error" id="nimError"></small>
            </div>


            <div class="form-group">
                <label for="username">
                    Nama Pengguna <span>*</span>
                </label>

                <div class="input-box">
                    <input type="text" id="username"
                           placeholder="cth. ahmad.fauzi"
                           autocomplete="username">

                    <!-- IKON @ -->
                    <svg class="field-icon at-icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         xmlns="http://www.w3.org/2000/svg">

                        <circle cx="12" cy="12" r="9"
                                stroke="currentColor"
                                stroke-width="1.8"/>

                        <path d="M15.5 12V9.7
                                 C15.5 8 14.4 7 12.8 7
                                 C10.4 7 8.5 9.1 8.5 12
                                 C8.5 14.1 9.5 15.3 11.2 15.3
                                 C12.5 15.3 13.6 14.5 14 13.3"
                              stroke="currentColor"
                              stroke-width="1.8"
                              stroke-linecap="round"/>

                        <path d="M15.5 9.7V13
                                 C15.5 14.5 16.3 15.3 17.3 15.3"
                              stroke="currentColor"
                              stroke-width="1.8"
                              stroke-linecap="round"/>
                    </svg>
                </div>

                <small class="field-error" id="usernameError"></small>
            </div>

        </div>


        <!-- EMAIL -->
        <div class="form-group">
            <label for="email">Email <span>*</span></label>

            <div class="input-box">
                <input type="email" id="email"
                       placeholder="cth. ahmad@unkhair.ac.id"
                       autocomplete="email">

                <svg class="field-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     xmlns="http://www.w3.org/2000/svg">

                    <rect x="3" y="5" width="18" height="14"
                          rx="2"
                          stroke="currentColor"
                          stroke-width="1.5"/>

                    <path d="M4 7L12 13L20 7"
                          stroke="currentColor"
                          stroke-width="1.5"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>
            </div>

            <small class="field-error" id="emailError"></small>
        </div>


        <!-- KATA SANDI -->
        <div class="form-group">
            <label for="password">Kata Sandi <span>*</span></label>

            <div class="input-box">
                <input type="password" id="password"
                       placeholder="Minimal 8 karakter"
                       autocomplete="new-password">

                <button type="button" class="eye-button"
                        id="togglePassword"
                        aria-label="Tampilkan kata sandi">

                    <svg class="eye-icon" viewBox="0 0 24 24"
                         fill="none"
                         xmlns="http://www.w3.org/2000/svg">

                        <path d="M2 12C4.2 7.8 7.7 5.5 12 5.5
                                 C16.3 5.5 19.8 7.8 22 12
                                 C19.8 16.2 16.3 18.5 12 18.5
                                 C7.7 18.5 4.2 16.2 2 12Z"
                              stroke="currentColor"
                              stroke-width="1.6"/>

                        <circle cx="12" cy="12" r="3"
                                stroke="currentColor"
                                stroke-width="1.6"/>

                        <path d="M3 3L21 21"
                              stroke="currentColor"
                              stroke-width="1.6"
                              stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <small class="field-error" id="passwordError"></small>
        </div>


        <!-- KONFIRMASI PASSWORD -->
        <div class="form-group">
            <label for="confirmPassword">
                Konfirmasi Kata Sandi <span>*</span>
            </label>

            <div class="input-box">
                <input type="password" id="confirmPassword"
                       placeholder="Ulangi kata sandi"
                       autocomplete="new-password">

                <button type="button" class="eye-button"
                        id="toggleConfirmPassword"
                        aria-label="Tampilkan kata sandi">

                    <svg class="eye-icon" viewBox="0 0 24 24"
                         fill="none"
                         xmlns="http://www.w3.org/2000/svg">

                        <path d="M2 12C4.2 7.8 7.7 5.5 12 5.5
                                 C16.3 5.5 19.8 7.8 22 12
                                 C19.8 16.2 16.3 18.5 12 18.5
                                 C7.7 18.5 4.2 16.2 2 12Z"
                              stroke="currentColor"
                              stroke-width="1.6"/>

                        <circle cx="12" cy="12" r="3"
                                stroke="currentColor"
                                stroke-width="1.6"/>

                        <path d="M3 3L21 21"
                              stroke="currentColor"
                              stroke-width="1.6"
                              stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <small class="field-error" id="confirmPasswordError"></small>
        </div>


        <p class="form-message" id="formMessage"
           role="status" aria-live="polite"></p>


        <!-- TOMBOL DAFTAR -->
        <button type="submit" class="register-button">
            <span>Daftar Akun</span>

            <svg class="arrow-icon" viewBox="0 0 24 24"
                 fill="none"
                 xmlns="http://www.w3.org/2000/svg">

                <path d="M4 12H19"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"/>

                <path d="M13 6L19 12L13 18"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>
            </svg>
        </button>

    </form>


    <!-- KEMBALI LOGIN -->
    <p class="login-text">
        <span>Sudah punya akun?</span>

        <a href="../Login/login.html">
            <span>Masuk</span>

            <!-- IKON PANAH MASUK KE PINTU -->
            <svg class="login-arrow"
                 viewBox="0 0 24 24"
                 fill="none"
                 xmlns="http://www.w3.org/2000/svg">

                <!-- Bingkai pintu -->
                <path d="M17 4H20V20H17"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>

                <!-- Panah masuk -->
                <path d="M3 12H16"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"/>

                <path d="M11 7L16 12L11 17"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>
            </svg>
        </a>
    </p>

</section>
</main>

<script src="./register.js"></script>
</body>
</html>
